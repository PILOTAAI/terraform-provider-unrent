# Release of terraform-provider-unrent in PILOTAAI/terraform-provider-unrent (docs/terraform.md §6), in the layout
# both registries require (developer.hashicorp.com/terraform/registry/providers/publishing, fetched 2026-11-16):
# one zip per OS/arch holding terraform-provider-unrent_v<version>, <name>_<version>_manifest.json (protocol 6.0),
# <name>_<version>_SHA256SUMS over the zips and the manifest, and a BINARY (not armored) GPG detached signature
# <name>_<version>_SHA256SUMS.sig made with the key registered in the registries. Based on
# hashicorp/terraform-provider-scaffolding-framework's .goreleaser.yml (main, fetched 2026-11-16).
version: 2
project_name: terraform-provider-unrent
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, '386']
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
changelog:
  disable: true
