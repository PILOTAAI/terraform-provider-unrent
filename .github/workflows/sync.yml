name: sync
# Copies terraform-provider-unrent/ of PILOTAAI/unrent into this repository for each release tag
# terraform-provider-v<version> on PILOTAAI/unrent's main (read-only deploy key UNRENT_SOURCE_DEPLOY_KEY), tags the
# copy v<version> here and starts release.yml at it (a tag pushed with GITHUB_TOKEN starts no workflow; a dispatch
# does). The registries require the provider in a public repository of its own named terraform-provider-<name>.
# .github/ is not copied: its workflows are managed by OpenTofu in PILOTAAI/unrent (infra/github/terraform-provider.tf).
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # push the copy and its tag
      actions: write           # dispatch release.yml at the tag
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PILOTAAI/unrent
          ssh-key: ${{ secrets.UNRENT_SOURCE_DEPLOY_KEY }}
          path: src
          fetch-depth: 0
          persist-credentials: true
      - name: Copy and tag new provider releases
        run: |
          set -eu
          git -C self config user.name "unrent-sync"
          git -C self config user.email "unrent-sync@users.noreply.github.com"
          git -C src fetch --quiet origin 'refs/tags/terraform-provider-v*:refs/tags/terraform-provider-v*' main
          for tag in $(git -C src tag -l 'terraform-provider-v*' --sort=v:refname); do
            v=${tag#terraform-provider-v}
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "$tag: not a semantic version; skipped"; continue; }
            if git -C self rev-parse -q --verify "refs/tags/v$v" >/dev/null; then continue; fi
            sha=$(git -C src rev-list -n 1 "$tag")
            git -C src merge-base --is-ancestor "$sha" origin/main || { echo "::warning::$tag is not on PILOTAAI/unrent main; skipped"; continue; }
            git -C src checkout --quiet "$sha"
            rsync -a --delete --exclude .git --exclude .github "src/terraform-provider-unrent/" "self/"
            git -C self add -A
            git -C self commit --quiet --allow-empty -m "terraform-provider-unrent $v from PILOTAAI/unrent@$sha ($tag)"
            git -C self tag "v$v"
            git -C self push --quiet origin HEAD:main "v$v"
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$v"
            echo "$tag → v$v: copied, tagged, release started"
          done
