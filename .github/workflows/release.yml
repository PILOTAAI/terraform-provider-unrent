name: release
# Publishes a provider release in PILOTAAI/terraform-provider-unrent (docs/terraform.md §6 in PILOTAAI/unrent): at a
# tag v<version> that sync.yml copied from PILOTAAI/unrent's terraform-provider-v<version>, it tests, builds with
# GoReleaser (.goreleaser.yml: zips, manifest, SHA256SUMS) and signs SHA256SUMS with the provider's GPG key. The
# Terraform Registry (webhook) and the OpenTofu Registry (indexes GitHub releases) pick the release up from here.
#
# Gate: nothing is built or published until the owner has created the signing key and stored it here as the
# secrets GPG_PRIVATE_KEY (ASCII-armored, RSA: the Terraform Registry refuses the default ECC keys) and PASSPHRASE of
# the environment `release` (deployable from v* tags only, reviewers once the owner names them: infra/github). Until
# then the run fails with that instruction and publishes nothing.
#
# Only a sync.yml copy is signed: the tagged commit is on this repository's main, its message names the
# PILOTAAI/unrent commit and release tag it was copied from, that tag is on PILOTAAI/unrent's main, and the tagged
# tree is exactly terraform-provider-unrent/ at that commit (read with the read-only deploy key).
#
# This file is managed by OpenTofu from PILOTAAI/unrent (infra/github/terraform-provider.tf): change it there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release       # the GPG key; v* tags only (infra/github/terraform-provider.tf)
    permissions:
      contents: write          # create the GitHub release and upload its assets
    steps:
      - name: The signing key exists (owner step, docs/terraform.md §6)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::No provider signing key yet: create an RSA 4096 GPG key, add GPG_PRIVATE_KEY (gpg --armor --export-secret-keys <id>) and PASSPHRASE as secrets of this repository's environment release (not repository secrets), register the public key in both registries (docs/terraform.md §6), then run this workflow again at ${GITHUB_REF_NAME}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The source, read-only (the deploy key exists only during this step), to compare the tagged tree with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PILOTAAI/unrent
          ssh-key: ${{ secrets.UNRENT_SOURCE_DEPLOY_KEY }}
          path: unrent-src
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a sync.yml copy of a PILOTAAI/unrent release tag on main
        run: |
          v=${GITHUB_REF_NAME#v}
          printf '%s\n' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::bad tag $GITHUB_REF_NAME"; exit 1; }
          git rev-parse --verify --quiet origin/main >/dev/null || { echo "::error::origin/main is missing from the checkout"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; not signing"; exit 1; }
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          sha=${subject#"terraform-provider-unrent $v from PILOTAAI/unrent@"}
          sha=${sha%" (terraform-provider-v$v)"}
          if ! printf '%s\n' "$sha" | grep -Eqx '[0-9a-f]{40}' || [ "$subject" != "terraform-provider-unrent $v from PILOTAAI/unrent@$sha (terraform-provider-v$v)" ]; then
            echo "::error::$GITHUB_REF_NAME is not a sync.yml copy (commit message: $subject); not signing"; exit 1
          fi
          [ "$(git -C unrent-src rev-parse --verify --quiet "refs/tags/terraform-provider-v$v^{commit}")" = "$sha" ] \
            || { echo "::error::PILOTAAI/unrent terraform-provider-v$v is not $sha; not signing"; exit 1; }
          git -C unrent-src merge-base --is-ancestor "$sha" origin/main || { echo "::error::PILOTAAI/unrent $sha is not on its main; not signing"; exit 1; }
          git -C unrent-src checkout --quiet "$sha"
          diff -r --exclude=.git --exclude=.github --exclude=unrent-src unrent-src/terraform-provider-unrent . \
            || { echo "::error::the tagged tree differs from PILOTAAI/unrent terraform-provider-unrent/ at $sha; not signing"; exit 1; }
          rm -rf unrent-src
          echo "$GITHUB_REF_NAME = PILOTAAI/unrent terraform-provider-v$v ($sha, on main), byte for byte"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Build, checksum, sign and publish
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
      - name: The signature verifies with the imported key
        run: |
          v=${GITHUB_REF_NAME#v}
          gpg --batch --verify "dist/terraform-provider-unrent_${v}_SHA256SUMS.sig" "dist/terraform-provider-unrent_${v}_SHA256SUMS"
          (cd dist && sha256sum -c --ignore-missing "terraform-provider-unrent_${v}_SHA256SUMS")
          # The manifest is uploaded from the repository root (release.extra_files), listed under its release name.
          grep -qx "$(sha256sum terraform-registry-manifest.json | cut -d' ' -f1)  terraform-provider-unrent_${v}_manifest.json" "dist/terraform-provider-unrent_${v}_SHA256SUMS"
